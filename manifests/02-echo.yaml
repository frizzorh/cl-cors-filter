apiVersion: v1
kind: Namespace
metadata:
  name: echo-demo
  labels:
    app: http-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: echo-demo
  labels:
    app: http-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-echo
  template:
    metadata:
      labels:
        app: http-echo
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:0.9.2
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: http-echo
  namespace: echo-demo
  labels:
    app: http-echo
spec:
  selector:
    app: http-echo
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo
  namespace: echo-demo
spec:
  parentRefs:
  - name: echo-gateway
    namespace: openshift-ingress
  hostnames:
  - echo.gwapi.apps.cluster-k5msd.dyn.redhatworkshops.io
  rules:
  # Actual requests: CORS response headers via Gateway API ResponseHeaderModifier.
  # OPTIONS preflight is short-circuited at the gateway (HTTP 204, no backend)
  # by manifests/04-cors-preflight-envoyfilter.yaml — this CRD has no CORS/DirectResponse filter.
  - matches:
    - path:
        type: PathPrefix
        value: /
      method: GET
    - path:
        type: PathPrefix
        value: /
      method: POST
    - path:
        type: PathPrefix
        value: /
      method: PUT
    - path:
        type: PathPrefix
        value: /
      method: PATCH
    - path:
        type: PathPrefix
        value: /
      method: DELETE
    - path:
        type: PathPrefix
        value: /
      method: HEAD
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Access-Control-Allow-Methods
          value: "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD"
        - name: Access-Control-Allow-Headers
          value: "Content-Type, Authorization, X-Requested-With, Accept, Origin, X-Demo"
        - name: Access-Control-Expose-Headers
          value: "*"
        - name: Access-Control-Max-Age
          value: "86400"
    backendRefs:
    - name: http-echo
      port: 8080